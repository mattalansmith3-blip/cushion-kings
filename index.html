) .touchhint{display:none}.chiefcard .chip{margin:6px auto 2px;display:inline-block}#touchHint{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .3s}#touchHint.show{opacity:1}#touchHint .th{position:absolute;bottom:calc(var(--sab) + 96px);font:800 13px "Baloo 2",sans-serif;color:#fff;text-align:center;background:#111827bf;border:2px solid #FFCC00;border-radius:12px;padding:6px 12px;animation:thp 1.2s ease-in-out infinite}#touchHint .th b{font-size:18px;color:#fc0}#touchHint .th small{display:block;font-size:11px;opacity:.85}#touchHint .l{left:calc(var(--sal) + 20px)}#touchHint .r{right:calc(var(--sar) + 20px)}@keyframes thp{50%{transform:translateY(-5px)}}.medals{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.medal{font:800 13px "Baloo 2",sans-serif;border-radius:12px;padding:6px 14px;color:#111827;text-align:center}.medal b{display:block;font-size:18px}.medal small{display:block;font-size:11px}.medal.gold{background:#fc0}.medal.silver{background:#e5e7eb}.medal.bronze{background:#f59e0b}.streak{font:800 14px "Baloo 2",sans-serif;color:#ff9f43;margin-top:8px}.dailychip{background:#7c3aed!important;color:#fff!important}.cond.classic{border:2px solid #FFCC00}.cond.classic.off{opacity:.7;border-style:dashed}.cond.classic .chip{display:block;margin:6px auto 0}.protour{font:800 12px "Baloo 2",sans-serif;color:#ff6b35;letter-spacing:1px}.recap{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:48px;margin-top:6px}.rbar{display:inline-block;width:22px;background:#fc0;border-radius:4px 4px 0 0;position:relative}.rbar b{position:absolute;top:-16px;left:0;right:0;font:800 11px "Baloo 2";color:#fff}.shelf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0;padding:10px;background:linear-gradient(#5d4037,#3e2723);border-bottom:6px solid #2a1a14;border-radius:10px}.trophy{width:110px;text-align:center}.trophy span{font-size:38px;display:block}.trophy small{font:700 11px "Baloo 2",sans-serif;color:#fde68a}.trophy.empty{width:auto}.statwall{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.statwall div{background:#00000040;border-radius:8px;padding:4px}.statwall b{display:block;font:800 18px "Baloo 2";color:#fc0}.statwall small{font-size:10px}#gapTrack{position:fixed;top:calc(var(--sat) + 48px);left:calc(var(--sal) + 10px);display:flex;flex-direction:column;gap:2px;font:800 13px "Baloo 2",sans-serif;z-index:21;pointer-events:none}#gapTrack span{background:#111827b8;border-radius:8px;padding:1px 8px}#gapTrack .ga{color:#fc0}#gapTrack .gb{color:#93c5fd}#gapTrack .lead{color:#34c759}.ldelta{display:block;font:800 11px "Baloo 2",sans-serif;font-style:normal;margin-top:2px}.ldelta.fast{color:#16a34a}.ldelta.slow{color:#dc2626}.crival.bounty{outline:2px solid #FF6B35;border-radius:8px}#autoRing{position:fixed;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 66px);z-index:75;width:150px;padding:6px;border-radius:16px;border:3px solid #111827;background:#fc0;color:#111827;font:800 11px "Baloo 2",sans-serif;text-align:center}#autoRing b{display:block;font:400 34px Luckiest Guy,sans-serif;line-height:1}#autoRing.hidden{display:none}#msg{top:40%}.abar .classicbtn .x2{font-style:normal;background:#d32f2f;color:#fff;border-radius:8px;padding:0 6px;font-size:11px;margin-left:4px}.abar button.alt{background:#e5e7eb}.pb{font:800 14px "Baloo 2",sans-serif;color:#fc0;text-align:left}.trophy.small span{font-size:28px}#raceCall{position:fixed;left:50%;top:24%;transform:translate(-50%) scale(.6);font:400 clamp(30px,6vw,56px) "Luckiest Guy",sans-serif;color:#fc0;-webkit-text-stroke:2px #111827;text-shadow:0 4px 0 #b45309;opacity:0;transition:all .25s;z-index:32;pointer-events:none;text-align:center}#raceCall small{display:block;font:800 16px "Baloo 2",sans-serif;color:#fff;-webkit-text-stroke:0;text-shadow:1px 1px 0 #111827}#raceCall.show{opacity:1;transform:translate(-50%) scale(1)}#lastTag{position:fixed;top:calc(var(--sat) + 50px);right:calc(var(--sar) + 12px); <body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <button id="exitBtn" class="chip" data-action="exit">EXIT</button>
      <button id="pauseBtn" class="chip" data-action="pause">II</button>
      <div class="hud-val pos"><span id="pos">P4</span><small id="posOf">/ 4</small></div>
    </div>
    <div class="hud-mid"><div id="curLap">00.000</div><div id="lapTag"></div></div>
    <div class="hud-right">
      <div class="hud-val lapbox"><div id="lap">1 / 10</div><div id="bestLap">BEST --.---</div></div>
      <button id="soundBtn" class="chip" data-action="sound">SOUND</button>
    </div>
  </div>
  <div id="session" class="hidden"></div><div id="gapTrack" class="hidden"></div><div id="lastTag" class="hidden">LAST 3</div>
  <div id="lights" class="hidden"><i></i><i></i><i></i><i></i></div>
  <div id="dash" class="hidden"><div id="mph">0</div><div id="rpmBox"><div id="rpmBar"></div></div></div>
  <div id="msg"></div><div id="spot"></div>
  <div id="pop"></div>
  <div id="debug" class="hidden"></div>

  <div id="touch" class="hidden">
    <div class="pad steer" id="padL" data-key="left">◀</div>
    <div class="pad steer" id="padR" data-key="right">▶</div>
    <div class="pad brake" id="padB" data-key="down">BRK</div>
    <div class="pad gas" id="padG" data-key="up">GAS</div>
  </div>

  <div id="menu" class="screen">
    <div class="records" id="records"></div>
    <div class="money-pill" id="menuMoney">$0</div>
    <h1>CUSHION KINGS</h1>
    <h3>Sprint Car Showdown</h3>
    <div class="btn-row" id="trackBtns"></div>
    <div class="settings"><button class="chip toggle dailychip" data-action="daily" id="dailyBtn">TONIGHT'S FEATURE</button> <button class="chip toggle shopchip" data-action="shop">SPEED SHOP</button> <button class="chip toggle" data-action="trophies">TROPHIES</button> <button class="chip toggle" data-action="mode" id="modeBtn">MODE: CAREER</button> <button class="chip toggle" data-action="ghost" id="ghostBtn">RACING LINE: ON</button> <button class="chip toggle" data-action="spotter" id="spotBtn">SPOTTER: ON</button> <button class="chip toggle on" data-action="cam" id="camBtn">CAMERA: ZOOM</button> <button class="chip toggle" data-action="auto" id="autoBtn">AUTO-NEXT: OFF</button></div>
    <div class="vols"><label>MUSIC <input type="range" id="musicVol" min="0" max="100" step="5"></label> <label>ENGINE <input type="range" id="engineVol" min="0" max="100" step="5"></label></div>
    <div class="hint keyhint">Arrows / WASD to drive &middot; P to pause</div><div class="hint touchhint">Left thumb: &#9664; &#9654; steer &middot; Right thumb: hold GAS &middot; lift + steer to slide</div>
  </div>

  <div id="results" class="screen hidden">
    <h1 id="resTitle">FINISHED P1</h1>
    <div id="resTime">BEST LAP: --.---</div>
    <div id="resStats"></div>
    <div id="resTable"></div>
    <div class="btn-row abar" id="resBtns"><button data-action="exit">Back to Menu</button></div>
  </div>

  <div id="shop" class="screen hidden">
    <div class="shop-top"><button class="chip" data-action="shopBack">◀ BACK</button><h2>SPEED SHOP</h2><div class="money-pill" id="shopMoney">$0</div></div>
    <div class="shop-tabs" id="shopTabs"><button class="chip toggle" data-action="shopTab" data-tab="perf">PERFORMANCE</button><button class="chip toggle" data-action="shopTab" data-tab="look">PAINT &amp; NUMBER</button></div>
    <div id="shopSum"></div>
    <div id="shopGrid"></div>
    <div id="shopMsg"></div>
    <div class="btn-row abar" id="shopBar"><button data-action="shopBack" id="shopBackBtn">Back</button></div>
  </div>

  <div id="prerace" class="screen hidden"><div id="preraceBody"></div></div>
  <div id="career" class="screen hidden"><div id="careerBody"></div></div>

  <div id="pause" class="screen hidden">
    <h1>PAUSED</h1>
    <div class="btn-row"><button data-action="resume">Resume</button><button data-action="exit">Exit Race</button></div>
  </div>

  <div id="rotate" class="screen"><div class="phone"></div><h3>Rotate your phone to landscape</h3></div>

</body>
</html>
