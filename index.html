ize:12px}#setOpts .vols input[type=range]{width:78px;min-width:78px}@media (max-height: 460px){#career .cwrap:has(.crival)>.scard.rivcard,#career .rivcard{max-height:none!important;overflow:visible!important}#career .rivcard .crival{font-size:11px!important;line-height:1.05!important;margin:0!important;padding:0!important}#career .rivcard .crival small{font-size:9px!important}#career .rivcard h2,#career .rivcard h3{margin-bottom:2px!important}}#menu #trackBtns .mainrow.two{display:flex;gap:14px;justify-content:center;width:min(640px,86vw);margin:0 auto}#menu #trackBtns .mainrow.two .bigmain{flex:1;width:auto!important}#menu #trackBtns .mainrow.two .qrbig small{display:block}#menu .settings .chip{min-width:110px}.garage .gprev{width:380px}.garage .gprev canvas,#gcar{width:380px!important;height:224px!important}.gnumtab{justify-content:center;align-items:center;display:flex}#resTable .rorder{grid-column:1 / -1;display:grid;grid-auto-flow:column;grid-template-columns:repeat(4,1fr);gap:2px 10px}#resTable .rorder>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}#resTable .rorder .me{background:#3b2f00;color:#fc0!important;border-radius:6px;padding:0 4px;outline:2px solid #FFCC00}#resHero .podium{align-items:flex-start!important}#resHero .pstep canvas,#resHero .pstep.p1 canvas{width:64px!important;height:74px!important}#resHero .pstep span{width:64px}.gstep .gnumwrap{display:inline-flex;align-items:center;font:400 22px Luckiest Guy,sans-serif;color:#fff}.gstep .gnumin{width:2.4em;font:400 22px Luckiest Guy,sans-serif;text-align:center;color:#111827;background:#fff;border:2px solid #FFCC00;border-radius:8px;padding:2px 0 0;margin-left:2px}.gnumerr{display:block;color:#fca5a5;font-size:11px;min-height:13px}</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <button id="exitBtn" class="chip" data-action="exit" aria-label="Exit"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 2.5H3.5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1H7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M8 9h7.5M12.3 5.5 15.8 9l-3.5 3.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="pauseBtn" class="chip" data-action="pause" aria-label="Pause"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4.5" height="14" rx="1.2" fill="#fff"/><rect x="10.5" y="2" width="4.5" height="14" rx="1.2" fill="#fff"/></svg></button>
      <div class="hud-val pos"><span id="pos">P4</span><small id="posOf">/ 4</small></div>
    </div>
    <div class="hud-mid"><div id="curLap">00.000</div><div id="lapTag"></div></div>
    <div class="hud-right">
      <div class="hud-val lapbox"><div id="lap">1 / 10</div><div id="bestLap">BEST --.---</div></div>
      <button id="soundBtn" class="chip" data-action="sound" aria-label="Sound"></button>
    </div>
  </div>
  <div id="session" class="hidden"></div><div id="gapTrack" class="hidden"></div><div id="leadBar" class="hidden"></div><div id="lastTag" class="hidden">LAST 3</div>
  <div id="lights" class="hidden"><i></i><i></i><i></i><i></i></div>
  <div id="dash" class="hidden"><div class="mphw"><div id="mph">0</div><small class="mphl">MPH</small></div><div id="rpmBox"><div id="rpmBar"></div></div></div>
  <div id="msg"></div><div id="spot"></div>
  <div id="pop"></div>
  <div id="debug" class="hidden"></div>

  <div id="touch" class="hidden">
    <div class="pad steer" id="padL" data-key="left">◀</div>
    <div class="pad steer" id="padR" data-key="right">▶</div>
    <div class="pad brake" id="padB" data-key="down">BRK</div>
    <div class="pad gas" id="padG" data-key="up">GAS</div>
  </div>

  <div id="menu" class="screen">
    <div class="records" id="records"></div>
    <div class="money-pill" id="menuMoney">$0</div>
    <button class="setcorner" data-action="settings" aria-label="Settings" title="Settings">&#9881;</button>
    <button class="tipcorner" data-action="tipScreen" aria-label="Tip the Crew" title="Tip the Crew">&#9749;</button>
    <h1>CUSHION KINGS</h1>
    <h3>Sprint Car Showdown</h3>
    <div class="btn-row" id="trackBtns"></div>
    <div class="settings"><button class="chip toggle morechip" data-action="moreRaces" id="moreBtn">MORE RACES</button> <button class="chip toggle garagechip" data-action="shop">GARAGE</button> <button class="chip toggle shopchip" data-action="pits">STORE</button><button class="hidden" id="dailyBtn" data-action="daily" aria-hidden="true" tabindex="-1"></button> <button class="chip toggle" data-action="mode" id="modeBtn">MODE: CAREER</button> <button class="chip toggle on" data-action="cam" id="camBtn">CAMERA: ZOOM</button></div>
    <div class="vols"><label>MUSIC <input type="range" id="musicVol" min="0" max="100" step="5"></label> <label>ENGINE <input type="range" id="engineVol" min="0" max="100" step="5"></label> <label class="annc">ANNOUNCER <input type="checkbox" id="annChk"></label></div>
    <div class="hint keyhint">Arrows / WASD to drive &middot; P to pause</div><div class="hint touchhint">Left thumb: &#9664; &#9654; steer &middot; Right thumb: hold GAS &middot; lift + steer to slide</div>
  </div>

  <div id="results" class="screen hidden">
    <div class="resPanel">
      <h1 id="resTitle">FINISHED P1</h1>
      <div id="resTime">BEST LAP: --.---</div>
      <div id="resStats"></div>
      <div id="resTable"></div>
      <div class="btn-row abar" id="resBtns"><button data-action="exit">Back to Menu</button></div>
    </div>
  </div>

  <div id="shop" class="screen hidden">
    <div class="shop-top"><button class="chip" data-action="shopBack">◀ BACK</button><h2>STORE</h2><div class="money-pill" id="shopMoney">$0</div></div>
    <div class="shop-tabs" id="shopTabs"><button class="chip toggle" data-action="shopTab" data-tab="perf">UPGRADES</button><button class="chip toggle" data-action="shopTab" data-tab="eng">ENGINE</button><button class="chip toggle" data-action="shopTab" data-tab="look">PAINT</button><button class="chip toggle" data-action="shopTab" data-tab="num">NUMBER</button><button class="chip toggle" data-action="shopTab" data-tab="spon">SPONSOR</button></div>
    <div id="shopGrid"></div>
    <div id="shopSum"></div>
    <div id="shopMsg"></div>
    <div class="btn-row abar" id="shopBar"><button data-action="shopBack" id="shopBackBtn">Back</button></div>
  </div>

  <div id="prerace" class="screen hidden"><div id="preraceBody"></div></div>
  <div id="career" class="screen hidden"><div id="careerBody"></div></div>

  <div id="pause" class="screen hidden">
    <h1>PAUSED</h1>
    <div class="btn-row"><button data-action="resume">Resume</button><button data-action="exit">Exit Race</button></div>
  </div>

  <div id="rotate" class="screen"><div class="phone"></div><h3>Rotate your phone to landscape</h3></div>

</body>
</html>
