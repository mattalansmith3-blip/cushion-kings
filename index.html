:ckConf 1.1s ease-out forwards;transform:rotate(calc(var(--i) * 20deg)) translateY(0)}@keyframes ckConf{to{transform:rotate(calc(var(--i) * 20deg)) translateY(-90px);opacity:0}}.swatch.decal[disabled]{opacity:.5}#career{overflow-y:auto}#careerBody{max-width:760px;margin:0 auto;text-align:center}.cwrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}.ctable div,.cstand div{display:flex;justify-content:space-between;gap:10px;font-size:14px}.ctable .me,.cstand .me{color:#fc0}.crival{text-align:left;font-size:14px}.crival small{display:block;font-size:11px;color:#9ca3af}.cstand{margin-top:8px;border-top:2px solid rgba(255,255,255,.2);padding-top:4px}.cmoney{position:static;display:inline-block;margin-bottom:6px}#menu .chip,#menu button,.chip.toggle,.shopchip{min-height:44px;display:inline-flex;align-items:center;justify-content:center}.vols label{min-height:44px;display:inline-flex;align-items:center;gap:6px}.vols input[type=range],input[type=range]{height:44px;min-width:110px;margin:0;touch-action:none}#prerace .pip.opt,#card-setup .pip.opt{min-width:52px!important;min-height:44px!important;height:44px!important;padding:0 10px}#exitBtn,#pauseBtn,#soundBtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}#prerace .rec .chief{display:block;color:#fc0;font:800 13px "Baloo 2",sans-serif;margin:4px 0 2px}</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <button id="exitBtn" class="chip" data-action="exit">EXIT</button>
      <button id="pauseBtn" class="chip" data-action="pause">II</button>
      <div class="hud-val pos"><span id="pos">P4</span><small id="posOf">/ 4</small></div>
    </div>
    <div class="hud-mid"><div id="curLap">00.000</div></div>
    <div class="hud-right">
      <div class="hud-val lapbox"><div id="lap">1 / 10</div><div id="bestLap">BEST --.---</div></div>
      <button id="soundBtn" class="chip" data-action="sound">SOUND</button>
    </div>
  </div>
  <div id="session" class="hidden"></div>
  <div id="lights" class="hidden"><i></i><i></i><i></i><i></i></div>
  <div id="dash" class="hidden"><div id="mph">0</div><div id="rpmBox"><div id="rpmBar"></div></div></div>
  <div id="msg"></div><div id="spot"></div>
  <div id="pop"></div>
  <div id="debug" class="hidden"></div>

  <div id="touch" class="hidden">
    <div class="pad steer" id="padL" data-key="left">◀</div>
    <div class="pad steer" id="padR" data-key="right">▶</div>
    <div class="pad brake" id="padB" data-key="down">BRK</div>
    <div class="pad gas" id="padG" data-key="up">GAS</div>
  </div>

  <div id="menu" class="screen">
    <div class="records" id="records"></div>
    <div class="money-pill" id="menuMoney">$0</div>
    <h1>CUSHION KINGS</h1>
    <h3>Sprint Car Showdown</h3>
    <div class="btn-row" id="trackBtns"></div>
    <div class="settings"><button class="chip toggle shopchip" data-action="shop">SPEED SHOP</button> <button class="chip toggle" data-action="mode" id="modeBtn">MODE: QUICK RACE</button> <button class="chip toggle" data-action="ghost" id="ghostBtn">RACING LINE: ON</button> <button class="chip toggle" data-action="spotter" id="spotBtn">SPOTTER: ON</button></div>
    <div class="vols"><label>MUSIC <input type="range" id="musicVol" min="0" max="100" step="5"></label> <label>ENGINE <input type="range" id="engineVol" min="0" max="100" step="5"></label></div>
    <div class="hint">Arrows / WASD to drive &middot; P to pause</div>
  </div>

  <div id="results" class="screen hidden">
    <h1 id="resTitle">FINISHED P1</h1>
    <div id="resTime">BEST LAP: --.---</div>
    <div id="resStats"></div>
    <div id="resTable"></div>
    <div class="btn-row" id="resBtns"><button data-action="exit">Back to Menu</button></div>
  </div>

  <div id="shop" class="screen hidden">
    <div class="shop-top"><button class="chip" data-action="shopBack">◀ BACK</button><h2>SPEED SHOP</h2><div class="money-pill" id="shopMoney">$0</div></div>
    <div class="shop-tabs" id="shopTabs"><button class="chip toggle" data-action="shopTab" data-tab="perf">PERFORMANCE</button><button class="chip toggle" data-action="shopTab" data-tab="look">PAINT &amp; NUMBER</button></div>
    <div id="shopSum"></div>
    <div id="shopGrid"></div>
    <div id="shopMsg"></div>
  </div>

  <div id="prerace" class="screen hidden"><div id="preraceBody"></div></div>
  <div id="career" class="screen hidden"><div id="careerBody"></div></div>

  <div id="pause" class="screen hidden">
    <h1>PAUSED</h1>
    <div class="btn-row"><button data-action="resume">Resume</button><button data-action="exit">Exit Race</button></div>
  </div>

  <div id="rotate" class="screen"><div class="phone"></div><h3>Rotate your phone to landscape</h3></div>

</body>
</html>
