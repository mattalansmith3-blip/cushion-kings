.on{background:#34c759;color:#111827;border:2px solid #fff}.ptag.sw{flex-direction:column;background:#374151;color:#fff;border:2px solid #9CA3AF;cursor:pointer;line-height:1}.ptag.sw b{font-size:11px;color:#fc0}.ptag.sw.poor b{color:#ff3b30}@media (max-height: 500px){.bopt b{font-size:14px}}#shop .pip,#prerace .pip{min-width:44px;min-height:44px}#shop .ptag.sw,#shop .swatch,#shop .numb,#shopTabs .chip,#shop .shop-top .chip{min-height:44px}#shopSum{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.edge{flex:1 1 320px;background:#1118278c;border-radius:10px;padding:6px 10px}.ehead{font-weight:800;font-size:12px;letter-spacing:.04em}.ehead small{opacity:.7;font-weight:600}.ebar{display:grid;grid-template-columns:52px 1fr 54px;align-items:center;gap:6px;font-size:12px;font-weight:800}.etrack{position:relative;height:10px;background:#ffffff1f;border-radius:5px}.etrack:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff9}.etrack i{position:absolute;top:0;bottom:0;border-radius:5px}.etrack i.pos{background:#22c55e}.etrack i.neg{background:#ef4444}.badges{display:flex;flex-direction:column;gap:6px}.badges span{background:#1118278c;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}.ud.on{background:#f59e0b!important;color:#111827}.ud small{display:block;font-weight:600;opacity:.8}.cond{color:#fde68a}.cond.big{font-size:18px;margin:4px 0 8px}.cond small{display:block;font-size:13px;color:#fff;opacity:.85}#prerace{overflow-y:auto}#preraceBody{max-width:720px;margin:0 auto;text-align:center}.scard.celebrate{animation:ckCeleb .9s ease-out;position:relative}@keyframes ckCeleb{0%{transform:scale(1);box-shadow:0 0 #fc0}30%{transform:scale(1.04);box-shadow:0 0 24px 6px #fc0}to{transform:scale(1);box-shadow:0 0 0 0 transparent}}.confetti{position:absolute;inset:0;pointer-events:none;overflow:visible}.confetti i{position:absolute;left:50%;top:40%;width:7px;height:11px;background:hsl(calc(var(--i) * 40),90%,60%);animation:ckConf 1.1s ease-out forwards;transform:rotate(calc(var(--i) * 20deg)) translateY(0)}@keyframes ckConf{to{transform:rotate(calc(var(--i) * 20deg)) translateY(-90px);opacity:0}}.swatch.decal[disabled]{opacity:.5}#career{overflow-y:auto}#careerBody{max-width:760px;margin:0 auto;text-align:center}.cwrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}.ctable div,.cstand div{display:flex;justify-content:space-between;gap:10px;font-size:14px}.ctable .me,.cstand .me{color:#fc0}.crival{text-align:left;font-size:14px}.crival small{display:block;font-size:11px;color:#9ca3af}.cstand{margin-top:8px;border-top:2px solid rgba(255,255,255,.2);padding-top:4px}.cmoney{position:static;display:inline-block;margin-bottom:6px}#menu .chip,#menu button,.chip.toggle,.shopchip{min-height:44px;display:inline-flex;align-items:center;justify-content:center}.vols label{min-height:44px;display:inline-flex;align-items:center;gap:6px}.vols input[type=range],input[type=range]{height:44px;min-width:110px;margin:0;touch-action:none}#prerace .pip.opt,#card-setup .pip.opt{min-width:52px!important;min-height:44px!important;height:44px!important;padding:0 10px}#exitBtn,#pauseBtn,#soundBtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}#prerace .rec .chief{display:block;color:#fc0;font:800 13px "Baloo 2",sans-serif;margin:4px 0 2px}#trackBtns{flex-direction:column;align-items:center}.track-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.track-pick .chip{min-width:96px;min-height:44px}#trackBtns #startBtn{width:min(100%,300px);flex:none}</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <button id="exitBtn" class="chip" data-action="exit">EXIT</button>
      <button id="pauseBtn" class="chip" data-action="pause">II</button>
      <div class="hud-val pos"><span id="pos">P4</span><small id="posOf">/ 4</small></div>
    </div>
    <div class="hud-mid"><div id="curLap">00.000</div></div>
    <div class="hud-right">
      <div class="hud-val lapbox"><div id="lap">1 / 10</div><div id="bestLap">BEST --.---</div></div>
      <button id="soundBtn" class="chip" data-action="sound">SOUND</button>
    </div>
  </div>
  <div id="session" class="hidden"></div>
  <div id="lights" class="hidden"><i></i><i></i><i></i><i></i></div>
  <div id="dash" class="hidden"><div id="mph">0</div><div id="rpmBox"><div id="rpmBar"></div></div></div>
  <div id="msg"></div><div id="spot"></div>
  <div id="pop"></div>
  <div id="debug" class="hidden"></div>

  <div id="touch" class="hidden">
    <div class="pad steer" id="padL" data-key="left">◀</div>
    <div class="pad steer" id="padR" data-key="right">▶</div>
    <div class="pad brake" id="padB" data-key="down">BRK</div>
    <div class="pad gas" id="padG" data-key="up">GAS</div>
  </div>

  <div id="menu" class="screen">
    <div class="records" id="records"></div>
    <div class="money-pill" id="menuMoney">$0</div>
    <h1>CUSHION KINGS</h1>
    <h3>Sprint Car Showdown</h3>
    <div class="btn-row" id="trackBtns"></div>
    <div class="settings"><button class="chip toggle shopchip" data-action="shop">SPEED SHOP</button> <button class="chip toggle" data-action="mode" id="modeBtn">MODE: QUICK RACE</button> <button class="chip toggle" data-action="ghost" id="ghostBtn">RACING LINE: ON</button> <button class="chip toggle" data-action="spotter" id="spotBtn">SPOTTER: ON</button></div>
    <div class="vols"><label>MUSIC <input type="range" id="musicVol" min="0" max="100" step="5"></label> <label>ENGINE <input type="range" id="engineVol" min="0" max="100" step="5"></label></div>
    <div class="hint">Arrows / WASD to drive &middot; P to pause</div>
  </div>

  <div id="results" class="screen hidden">
    <h1 id="resTitle">FINISHED P1</h1>
    <div id="resTime">BEST LAP: --.---</div>
    <div id="resStats"></div>
    <div id="resTable"></div>
    <div class="btn-row" id="resBtns"><button data-action="exit">Back to Menu</button></div>
  </div>

  <div id="shop" class="screen hidden">
    <div class="shop-top"><button class="chip" data-action="shopBack">◀ BACK</button><h2>SPEED SHOP</h2><div class="money-pill" id="shopMoney">$0</div></div>
    <div class="shop-tabs" id="shopTabs"><button class="chip toggle" data-action="shopTab" data-tab="perf">PERFORMANCE</button><button class="chip toggle" data-action="shopTab" data-tab="look">PAINT &amp; NUMBER</button></div>
    <div id="shopSum"></div>
    <div id="shopGrid"></div>
    <div id="shopMsg"></div>
  </div>

  <div id="prerace" class="screen hidden"><div id="preraceBody"></div></div>
  <div id="career" class="screen hidden"><div id="careerBody"></div></div>

  <div id="pause" class="screen hidden">
    <h1>PAUSED</h1>
    <div class="btn-row"><button data-action="resume">Resume</button><button data-action="exit">Exit Race</button></div>
  </div>

  <div id="rotate" class="screen"><div class="phone"></div><h3>Rotate your phone to landscape</h3></div>

</body>
</html>
